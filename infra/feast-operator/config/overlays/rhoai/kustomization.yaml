apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: redhat-ods-applications

resources:
  - ../../default
  - ../../prometheus
  - tls_clusterrole.yaml
  - tls_clusterrolebinding.yaml

patches:
  - path: metrics_service_patch.yaml
    target:
      kind: Service
      name: controller-manager-metrics-service
  - path: manager_patch.yaml
    target:
      kind: Deployment
      name: controller-manager
  - path: servicemonitor_patch.yaml
    target:
      kind: ServiceMonitor
      name: controller-manager-metrics-monitor
  # patch to remove default `system` namespace in ../../manager/manager.yaml
  - path: delete-namespace.yaml

configMapGenerator:
  - name:  feast-operator-parameters
    envs:
      - params.env

configurations:
  - params.yaml

replacements:
  - source:
      kind: Service
      name: controller-manager-metrics-service
      fieldPath: metadata.name
    targets:
      - select:
          kind: ServiceMonitor
          name: controller-manager-metrics-monitor
        fieldPaths:
          - spec.endpoints.0.tlsConfig.serverName
        options:
          delimiter: "."
          index: 0
  - source:
      kind: Service
      name: controller-manager-metrics-service
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: ServiceMonitor
          name: controller-manager-metrics-monitor
        fieldPaths:
          - spec.endpoints.0.tlsConfig.serverName
        options:
          delimiter: "."
          index: 1
  - source:
      kind: ConfigMap
      name: feast-operator-parameters
      version: v1
      fieldPath: data.RELATED_IMAGE_FEAST_OPERATOR
    targets:
      - select:
          kind: Deployment
          name: controller-manager
        fieldPaths:
          - spec.template.spec.containers.[name=manager].image
  - source:
      kind: ConfigMap
      name: feast-operator-parameters
      fieldPath: data.RELATED_IMAGE_FEATURE_SERVER
    targets:
      - select:
          kind: Deployment
          name: controller-manager
        fieldPaths:
          - spec.template.spec.containers.[name=manager].env.[name=RELATED_IMAGE_FEATURE_SERVER].value
  - source:
      kind: ConfigMap
      name: feast-operator-parameters
      fieldPath: data.RELATED_IMAGE_CRON_JOB
    targets:
      - select:
          kind: Deployment
          name: controller-manager
        fieldPaths:
          - spec.template.spec.containers.[name=manager].env.[name=RELATED_IMAGE_CRON_JOB].value
  - source:
      kind: ConfigMap
      name: feast-operator-parameters
      fieldPath: data.OIDC_ISSUER_URL
    targets:
      - select:
          kind: Deployment
          name: controller-manager
        fieldPaths:
          - spec.template.spec.containers.[name=manager].env.[name=OIDC_ISSUER_URL].value
